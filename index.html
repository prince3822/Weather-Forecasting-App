<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body id="body">

<div class="container">

    <h1>🌤 Weather App</h1>

    <div class="search-box">
        <input type="text" id="city" placeholder="Enter City Name">
        <button id="btn">Search</button>
    </div>

    <p id="message"></p>

    <div id="weather">

        <!-- Weather Icon -->
        <!-- <img id="weatherIcon" src="" alt="Weather Icon"> -->

        <!-- City -->
        <h2 id="cityName"></h2>

        <!-- Temperature -->
        <h1 id="temp"></h1>

        <!-- Weather Condition -->
        <h3 id="condition"></h3>

        <!-- Feels Like -->
        <p id="feelsLike"></p>

        <!-- Details -->
        <div class="details">

            <div class="card">
                💧
                <h4>Humidity</h4>
                <p id="humidity"></p>
            </div>

            <div class="card">
                🌬
                <h4>Wind</h4>
                <p id="wind"></p>
            </div>

            <div class="card">
                👁
                <h4>Visibility</h4>
                <p id="visibility"></p>
            </div>

            <div class="card">
                📊
                <h4>Pressure</h4>
                <p id="pressure"></p>
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
